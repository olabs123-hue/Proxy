name: Pingora Rust prototype
on:
  push:
    paths:
      - "pingora-rust/**"
      - ".github/workflows/pingora-rust.yml"
  pull_request:
    paths:
      - "pingora-rust/**"
      - ".github/workflows/pingora-rust.yml"
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pingora-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo check
      - run: cargo test
      - run: python3 -m unittest discover -s tests -v
      - name: Start two origins and the Rust proxy
        run: |
          python3 scripts/origin.py --port 9001 --name origin-a > /tmp/edgeguard-a.log 2>&1 &
          python3 scripts/origin.py --port 9002 --name origin-b > /tmp/edgeguard-b.log 2>&1 &
          cargo run > /tmp/edgeguard-proxy.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sS -o /dev/null http://127.0.0.1:6188/health; then break; fi
            sleep 1
          done
          python3 scripts/smoke_test.py --requests 30
